<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو VIRUS P.S control</title>
<style>

  body { margin: 0; padding: 24px 16px 40px; background: #0f1420; color: #f2f2f2; font-family: 'Tahoma', 'Segoe UI', sans-serif; }

  .subtitle { text-align: center; color: #9aa4b8; font-size: 0.85rem; margin-bottom: 24px; }
  .menu { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #1b2436; border-radius: 10px; padding: 14px 16px; }
  .name { font-size: 1rem; }
  .price { font-weight: bold; color: #4ade80; white-space: nowrap; margin-inline-start: 12px; }

</style>
</head>
<body>
  <h1>VIRUS P.S control</h1>
  <div class="subtitle">منيو الكافتيريا</div>
