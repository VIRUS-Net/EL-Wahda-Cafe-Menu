<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو VIRUS P.S control</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: #0f1420; color: #f2f2f2; font-family: 'Tahoma', 'Segoe UI', sans-serif; }
  /* Wraps the title/subtitle too, not just .menu below - on a wide desktop browser (unlike a
     phone, where there's no extra width to begin with), text-align:center alone still leaves the
     WHOLE block spanning the full page width, which reads as "stuck to one side" rather than
     genuinely centered. One shared max-width + margin:auto wrapper is what actually centers
     everything as a single unit regardless of viewport width. */
  .page { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #9aa4b8; font-size: 0.85rem; margin-bottom: 24px; }
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #1b2436; border-radius: 10px; padding: 14px 16px; }
  .name { font-size: 1rem; }
  .price { font-weight: bold; color: #4ade80; white-space: nowrap; margin-inline-start: 12px; }
  .empty { text-align: center; color: #9aa4b8; margin-top: 40px; }
</style>
</head>
<body>
  <div class="page">
    <h1>VIRUS P.S control</h1>
    <div class="subtitle">منيو الكافتيريا</div>
    <div class="menu">
      
        <div class="item">
            <span class="name">Coke</span>
            <span class="price">20 ج.م</span>
        </div>
        <div class="item">
            <span class="name">شاى</span>
            <span class="price">15 ج.م</span>
        </div>
        <div class="item">
            <span class="name">قهوه</span>
            <span class="price">20 ج.م</span>
        </div>
    </div>
  </div>
</body>
</html>
