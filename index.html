<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو VIRUS P.S control</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: #1b0f1f; color: #dbe0eb; font-family: 'Tahoma', 'Segoe UI', sans-serif; }
  /* Wraps the title/subtitle too, not just .menu below - on a wide desktop browser (unlike a
     phone, where there's no extra width to begin with), text-align:center alone still leaves the
     WHOLE block spanning the full page width, which reads as "stuck to one side" rather than
     genuinely centered. One shared max-width + margin:auto wrapper is what actually centers
     everything as a single unit regardless of viewport width. */
  .page { max-width: 480px; margin: 0 auto; }
  .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .logo { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; margin-bottom: 8px; }
  h1 { text-align: center; font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { text-align: center; color: #9aa4b8; font-size: 0.85rem; }
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #1b2436; border-radius: 10px; padding: 10px 16px; }
  .item-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .thumb { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .name { font-size: 16px; color: #dbe0eb; }
  .price { font-weight: bold; font-size: 16px; color: #171618; white-space: nowrap; margin-inline-start: 12px; }
  .empty { text-align: center; color: #9aa4b8; margin-top: 40px; }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      
      <h1>VIRUS P.S control</h1>
      <div class="subtitle">منيو الكافتيريا</div>
    </div>
    <div class="menu">
      
        <div class="item">
            <div class="item-info">
                
                <span class="name">Coke</span>
            </div>
            <span class="price">20 ج.م</span>
        </div>
        <div class="item">
            <div class="item-info">
                
                <span class="name">شاى</span>
            </div>
            <span class="price">15 ج.م</span>
        </div>
        <div class="item">
            <div class="item-info">
                <img class="thumb" src="https://amrali026.github.io/VIRUS-EL-Wahda-Cafe-Menu/images/469911df-17be-4654-949e-6c81ba6f55f5.jpg" alt="">
                <span class="name">قهوه</span>
            </div>
            <span class="price">20 ج.م</span>
        </div>
    </div>
  </div>
</body>
</html>
